<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Gateway OS — Multi-Language Security Gateway</title>
    <meta name="description" content="Autonomous Security Gateway based on hardened Debian 13/Whonix with VLESS Reality egress and zero-leak boot isolation.">
    <meta http-equiv="refresh" content="2; url=./en/index.html">
    <script>
        (function() {
            const SUPPORTED = ['en', 'ru', 'es', 'zh', 'de', 'fr', 'pt', 'ja', 'tr', 'ar'];
            let target = 'en';
            try {
                const saved = localStorage.getItem('dg_lang');
                if (saved && SUPPORTED.includes(saved)) {
                    target = saved;
                } else {
                    const match = document.cookie.match(/dg_lang=([a-z]{2})/);
                    if (match && SUPPORTED.includes(match[1])) {
                        target = match[1];
                    } else {
                        const browserLangs = navigator.languages || [navigator.language || 'en'];
                        for (let l of browserLangs) {
                            if (!l) continue;
                            let code = l.toLowerCase().split('-')[0];
                            if (SUPPORTED.includes(code)) {
                                target = code;
                                break;
                            }
                        }
                    }
                }
            } catch(e) {}
            window.location.replace('./' + target + '/index.html');
        })();
    </script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            desktop: '#191a1d',
                            window: '#222222',
                            input: '#171717',
                            border: '#2e2e2e',
                            hover: '#2d2e32'
                        },
                        accent: {
                            green: '#8ab88c',
                            blue: '#7ea4b8',
                            purple: '#c678dd'
                        }
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', '"DejaVu Sans Mono"', 'monospace'],
                        sans: ['"Inter"', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
